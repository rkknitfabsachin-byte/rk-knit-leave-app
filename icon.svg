<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Loom / Weave lines -->
  <g stroke="#334155" stroke-width="6" opacity="0.4">
    <line x1="80" y1="140" x2="432" y2="140"/>
    <line x1="80" y1="200" x2="432" y2="200"/>
    <line x1="80" y1="260" x2="432" y2="260"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="80" y1="380" x2="432" y2="380"/>
  </g>
  <!-- Calendar / Leave Card -->
  <rect x="116" y="116" width="280" height="280" rx="44" fill="#FFFFFF" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.3))"/>
  <!-- Top header of calendar -->
  <path d="M116 160 C116 135 135 116 160 116 L352 116 C377 116 396 135 396 160 L396 196 L116 196 Z" fill="url(#accent)"/>
  <!-- Calendar pegs -->
  <rect x="180" y="92" width="24" height="48" rx="12" fill="#CBD5E1"/>
  <rect x="308" y="92" width="24" height="48" rx="12" fill="#CBD5E1"/>
  <!-- Knit loop / Checkmark shape -->
  <path d="M190 295 L235 340 L325 240" fill="none" stroke="url(#accent)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Golden notification badge -->
  <circle cx="396" cy="116" r="38" fill="url(#gold)"/>
  <text x="396" y="126" font-family="system-ui, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">RK</text>
</svg>